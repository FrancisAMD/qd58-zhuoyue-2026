name: backend-checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run check:worker
      - run: npm run test:worker
      - run: npm run test:catalog
      - run: npm run validate:universities -- data/university-catalog.template.json
      - run: npm run plan:universities -- --catalog data/university-catalog.template.json --existing data/university-catalog-existing.snapshot.template.json
      - run: python scripts/check-frontend-html.py
      - run: python backend/tests/schema-smoke.py
      - run: npm run test:backup
      - run: python backend/tests/xlsx-export-smoke.py
