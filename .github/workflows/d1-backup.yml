name: d1-encrypted-backup

on:
  schedule:
    # 18:05 UTC = 03:05 the following day in Asia/Tokyo.
    - cron: "5 18 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Backup action"
        type: choice
        required: true
        default: backup
        options:
          - backup
          - verify
      backup_id:
        description: "Existing backup ID (required for verify)"
        type: string
        required: false
      requested_by:
        description: "Opaque administrator ID for audit context"
        type: string
        required: false
      requested_at:
        description: "ISO-8601 request time"
        type: string
        required: false

permissions:
  contents: read

# D1 export temporarily makes the production database unavailable.
# Serialize scheduled/manual backups and verification to avoid overlapping jobs.
concurrency:
  group: qd58-d1-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Export, encrypt and verify D1 backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: "3d32e597-57e9-4e52-833b-98bdec7ffb0b"
      BACKUP_MASTER_KEY_V1: ${{ secrets.BACKUP_MASTER_KEY_V1 }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: qd58-d1-backups
      BACKUP_RETENTION_DAYS: "30"
      BACKUP_ACTION: ${{ github.event.inputs.action || 'backup' }}
      BACKUP_ID: ${{ github.event.inputs.backup_id || '' }}
      BACKUP_REQUESTED_BY: ${{ github.event.inputs.requested_by || '' }}
      BACKUP_REQUESTED_AT: ${{ github.event.inputs.requested_at || '' }}
      BACKUP_SOURCE: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      AWS_DEFAULT_REGION: auto
      AWS_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Checkout trusted default branch source
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python for AWS CLI
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install AWS CLI
        run: python -m pip install --disable-pip-version-check --no-cache-dir awscli

      - name: Configure R2 S3 addressing
        run: |
          aws configure set default.region auto
          aws configure set default.s3.addressing_style path

      - name: Verify required secrets are present
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$BACKUP_MASTER_KEY_V1"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$D1_DATABASE_ID"

      - name: Run encrypted D1 backup action
        run: node scripts/d1-backup-action.mjs
